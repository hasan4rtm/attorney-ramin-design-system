<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Badge — preview</title></head>
<body>
<div class="ar-preview--stack ar-preview" style="gap:var(--space-5)">
  <div class="ar-row">
    <span class="ar-badge">Car accidents</span>
    <span class="ar-badge ar-badge--accent">Featured</span>
    <span class="ar-badge ar-badge--pip">Verdict</span>

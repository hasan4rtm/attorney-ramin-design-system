<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Checkbox — preview</title></head>
<body>
<div class="ar-preview--stack ar-preview" style="gap:var(--space-6);padding:var(--space-10)">
  <label class="ar-check"><input type="checkbox" checked><span class="ar-check__text">I was injured in the last two years</span></label>
  <label class="ar-check"><input type="checkbox"><span class="ar-check__text">I agree to receive calls and text messages about my inquiry from RTM Law at the number I provided.<small>Message and data rates may apply. Reply STOP to opt out. Consent is not a condition of service.</small></span></label>
  <fieldset style="border:0;padding:0;margin:0;display:grid;gap:var(--space-3)">
    <legend class="ar-field__label" style="margin-bottom:var(--space-3)">Preferred language</legend>
    <div class="ar-row" style="gap:var(--space-8)">
      <label class="ar-check ar-radio"><input type="radio" name="lang" checked><span class="ar-check__text">English</span></label>
      <label class="ar-check ar-radio"><input type="radio" name="lang"><span class="ar-check__text" lang="es">Español</span></label>
    </div>
  </fieldset>
</div>

</body>
</html>

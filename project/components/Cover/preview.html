<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--page); color: var(--ink); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; height: 300px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 300px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 300px; }
  .slab { fill: var(--brand); }
  .tie { fill: var(--accent); }
  .tint { fill: var(--navy-200); }
  [data-theme="dark"] .tint { fill: var(--navy-700); }
  .pip { fill: var(--pip-on-brand); }
  .pipunit { fill: var(--page); }
  .words { position: absolute; left: var(--space-10); bottom: var(--space-8); max-width: 440px; }
  .name { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 96px; line-height: 0.95; letter-spacing: -0.025em; color: var(--ink); }
  .tag { margin: var(--space-3) 0 0 3px; font-size: 14px; line-height: 20px; color: var(--ink-muted); }
</style>

<!--
  blocks      brand 288×300 slab bleeding top, right and bottom (the suit, the largest field) · accent 56×232 bar over it, bleeding off the top (the tie) · navy-200 / navy-700 tint 128×196 bleeding off the bottom (the shirt, the relief) · pip-on-brand 48×12 once, right of the tie (the pocket square) — about 38% of 960×300
  arrangement one tall slab with a satellite: the tint on the left, the slab bleeding right, the tie a third of the way in and the pocket square beside it, as in the portrait; edges flush to the space grid, square corners (radius-none) because the system is tailored
  pattern     a literal motif, the foulard: the tie’s square dots as 4px page-coloured pips on a 16px pitch (space-4), three columns × fourteen rows = 42 units, cut out of the claret bar only
  scales      sides in space-2 multiples (12, 48, 56, 128, 196, 232, 288); gap space-6 (24) between tint and slab, space-8 (32) between tie and pocket square; pitch space-4; corners radius-none
-->
